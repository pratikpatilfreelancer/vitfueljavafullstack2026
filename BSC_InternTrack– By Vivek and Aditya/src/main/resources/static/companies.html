<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternTrack - Companies</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <h1>InternTrack</h1>
        <ul>
            <li><a href="/dashboard.html">Dashboard</a></li>
            <li><a href="/students.html">Students</a></li>
            <li><a href="/companies.html">Companies</a></li>
            <li><a href="/internships.html">Internships</a></li>
            <li><a href="/applications.html">Applications</a></li>
            <li><a href="/notifications.html">Notifications</a></li>
            <li><a href="/login.html">Login</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 class="page-title">Companies</h2>

        <div id="alertContainer"></div>

        <div class="card">
            <button class="btn btn-primary" onclick="openCompanyModal()">Add Company</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Company Name</th>
                        <th>Location</th>
                        <th>Industry</th>
                        <th>Website</th>
                        <th>Contact Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="companiesTableBody">
                    <tr><td colspan="6">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="companyModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="companyModalTitle">Add Company</h2>
                <button class="modal-close" onclick="closeCompanyModal()">&times;</button>
            </div>
            <form id="companyForm">
                <input type="hidden" id="companyId">
                <div class="form-group">
                    <label for="companyName">Company Name *</label>
                    <input type="text" id="companyName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="companyLocation">Location</label>
                        <input type="text" id="companyLocation">
                    </div>
                    <div class="form-group">
                        <label for="companyIndustry">Industry</label>
                        <input type="text" id="companyIndustry">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="companyWebsite">Website</label>
                        <input type="text" id="companyWebsite">
                    </div>
                    <div class="form-group">
                        <label for="companyContactEmail">Contact Email</label>
                        <input type="email" id="companyContactEmail">
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeCompanyModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/companies.js"></script>
</body>
</html>
