<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Details - Leave Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <h2 th:text="${employee.fullName}">Employee Name</h2>

        <div class="card shadow-sm p-3 mb-4 bg-white">
            <p><strong>Email:</strong> <span th:text="${employee.email}"></span></p>
            <p><strong>Department:</strong> <span th:text="${employee.department}"></span></p>
            <p><strong>Designation:</strong> <span th:text="${employee.designation}"></span></p>
            <p><strong>Date of Joining:</strong> <span th:text="${employee.dateOfJoining}"></span></p>
        </div>

        <!--
          This section demonstrates the One-to-Many relationship / JOIN:
          employee.leaveRequests is populated by Hibernate through the
          @OneToMany mapping on the Employee entity - i.e. behind the
          scenes Hibernate performs a JOIN between employees and
          leave_requests on employee_id to build this list.
        -->
        <h4>Leave History</h4>
        <table class="table table-bordered bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>Leave Type</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Days</th>
                    <th>Reason</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="leave : ${employee.leaveRequests}">
                    <td th:text="${leave.leaveType}"></td>
                    <td th:text="${leave.startDate}"></td>
                    <td th:text="${leave.endDate}"></td>
                    <td th:text="${leave.numberOfDays}"></td>
                    <td th:text="${leave.reason}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${leave.status.name() == 'APPROVED'} ? 'bg-success' : (${leave.status.name() == 'REJECTED'} ? 'bg-danger' : 'bg-warning text-dark')"
                              th:text="${leave.status}"></span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(employee.leaveRequests)}">
                    <td colspan="6" class="text-center text-muted">No leave requests yet.</td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/employees}" class="btn btn-secondary">Back to Employee List</a>
    </div>

</body>
</html>
