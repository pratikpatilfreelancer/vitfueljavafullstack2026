<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employees - Leave Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Employees</h2>
            <a th:href="@{/employees/new}" class="btn btn-primary">+ Add Employee</a>
        </div>

        <table class="table table-striped table-bordered bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Date of Joining</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- th:each loops over the "employees" list passed from EmployeeController -->
                <tr th:each="employee : ${employees}">
                    <td th:text="${employee.id}">1</td>
                    <td th:text="${employee.fullName}">John Doe</td>
                    <td th:text="${employee.email}">john@example.com</td>
                    <td th:text="${employee.department}">Engineering</td>
                    <td th:text="${employee.designation}">Software Engineer</td>
                    <td th:text="${employee.dateOfJoining}">2022-01-01</td>
                    <td>
                        <a th:href="@{/employees/view/{id}(id=${employee.id})}" class="btn btn-sm btn-info">View</a>
                        <a th:href="@{/employees/edit/{id}(id=${employee.id})}" class="btn btn-sm btn-warning">Edit</a>
                        <a th:href="@{/employees/delete/{id}(id=${employee.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Delete this employee? Their leave requests will be deleted too.');">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="7" class="text-center text-muted">No employees added yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
