<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Form - Leave Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <!-- Title changes depending on whether we're adding (id is null) or editing (id is set) -->
        <h2 th:text="${employee.id} != null ? 'Edit Employee' : 'Add Employee'">Add Employee</h2>

        <div class="card shadow-sm p-4 bg-white" style="max-width: 600px;">
            <!--
              th:object binds this form to the "employee" model attribute.
              th:action="save" posts to EmployeeController's saveEmployee()
              method, which handles both insert and update.
              The hidden id field is essential: if it's empty, JPA does an
              INSERT; if it has a value, JPA does an UPDATE on that row.
            -->
            <form th:action="@{/employees/save}" th:object="${employee}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" th:field="*{fullName}"/>
                    <!-- Shows the @NotBlank validation message if the field was left empty -->
                    <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" th:field="*{email}"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <input type="text" class="form-control" th:field="*{department}" placeholder="e.g. Engineering"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Designation</label>
                    <input type="text" class="form-control" th:field="*{designation}" placeholder="e.g. Software Engineer"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('designation')}" th:errors="*{designation}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Date of Joining</label>
                    <input type="date" class="form-control" th:field="*{dateOfJoining}"/>
                </div>

                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>

</body>
</html>
