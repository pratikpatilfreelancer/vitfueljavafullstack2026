<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Leave Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <h2 class="mb-4">Dashboard</h2>

        <div class="row g-3">
            <div class="col-md-3">
                <div class="card text-white bg-primary shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Total Employees</h6>
                        <p class="display-6" th:text="${totalEmployees}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-secondary shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Total Leave Requests</h6>
                        <p class="display-6" th:text="${totalLeaves}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card text-dark bg-warning shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Pending</h6>
                        <p class="display-6" th:text="${pendingLeaves}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card text-white bg-success shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Approved</h6>
                        <p class="display-6" th:text="${approvedLeaves}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card text-white bg-danger shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Rejected</h6>
                        <p class="display-6" th:text="${rejectedLeaves}">0</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-5">
            <h5>Quick Links</h5>
            <a th:href="@{/employees/new}" class="btn btn-primary me-2">+ Add Employee</a>
            <a th:href="@{/leaves/apply}" class="btn btn-outline-primary me-2">+ Apply for Leave</a>
            <a th:href="@{/leaves}" class="btn btn-outline-secondary">View All Leave Requests</a>
        </div>
    </div>

</body>
</html>
