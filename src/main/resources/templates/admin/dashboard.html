<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/layout :: header}"></div>
</head>
<body>
    <div class="container mt-4">
        <h2 class="mb-4">Admin Dashboard</h2>
        
        <!-- Stats Cards -->
        <div class="row mb-5">
            <div class="col-md-4 mb-3">
                <div class="card stat-card bg-white h-100">
                    <div class="card-body">
                        <h5>👨‍🏫 Teachers</h5>
                        <div class="stat-number" th:text="${teacherCount ?: 0}">0</div>
                        <a th:href="@{/admin/teachers}" class="btn btn-outline-primary btn-sm mt-3">Manage Teachers</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 mb-3">
                <div class="card stat-card bg-white h-100">
                    <div class="card-body">
                        <h5>🎓 Students</h5>
                        <div class="stat-number" th:text="${studentCount ?: 0}">0</div>
                        <a th:href="@{/admin/students}" class="btn btn-outline-success btn-sm mt-3">Manage Students</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 mb-3">
                <div class="card stat-card bg-white h-100">
                    <div class="card-body">
                        <h5>📚 Batches</h5>
                        <div class="stat-number" th:text="${batchCount ?: 0}">0</div>
                        <a th:href="@{/admin/batches}" class="btn btn-outline-warning btn-sm mt-3">Manage Batches</a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Quick Actions -->
        <h4>Quick Actions</h4>
        <div class="d-flex flex-wrap gap-2 mt-3">
            <a th:href="@{/admin/teachers/new}" class="btn btn-primary">➕ Add Teacher</a>
            <a th:href="@{/admin/students/new}" class="btn btn-success">➕ Add Student</a>
            <a th:href="@{/admin/batches/new}" class="btn btn-warning text-dark">➕ Add Batch</a>
            <a th:href="@{/admin/reports}" class="btn btn-info text-white">📊 Generate Report</a>
        </div>

        <!-- Section Navigation -->
        <hr class="mt-5">
        <h4>Navigate To</h4>
        <div class="row mt-3">
            <div class="col-md-3 mb-2">
                <a th:href="@{/admin/teachers}" class="btn btn-outline-primary w-100 py-3">
                    👨‍🏫 Teachers
                </a>
            </div>
            <div class="col-md-3 mb-2">
                <a th:href="@{/admin/students}" class="btn btn-outline-success w-100 py-3">
                    🎓 Students
                </a>
            </div>
            <div class="col-md-3 mb-2">
                <a th:href="@{/admin/batches}" class="btn btn-outline-warning w-100 py-3">
                    📚 Batches
                </a>
            </div>
            <div class="col-md-3 mb-2">
                <a th:href="@{/admin/reports}" class="btn btn-outline-info w-100 py-3">
                    📊 Reports
                </a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
