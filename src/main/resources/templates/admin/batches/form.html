<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${batchDto.id != null ? 'Edit Batch' : 'Add Batch'}">Batch Form - AMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>
    
    <div class="container mt-4">
        <!-- Breadcrumb / Navigation -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/batches}">Batches</a></li>
                <li class="breadcrumb-item active" th:text="${batchDto.id != null ? 'Edit Batch' : 'Add Batch'}">Form</li>
            </ol>
        </nav>

        <h2 th:text="${batchDto.id != null ? 'Edit Batch' : 'Add Batch'}" class="mb-3"></h2>
        
        <div class="card">
            <div class="card-body">
                <form th:action="@{${batchDto.id != null ? '/admin/batches/edit/' + batchDto.id : '/admin/batches/new'}}" 
                      th:object="${batchDto}" method="post">
                    
                    <input type="hidden" th:field="*{id}" th:if="${batchDto.id != null}">
                    
                    <div class="mb-3">
                        <label for="batchCode" class="form-label">Batch Code</label>
                        <input type="text" class="form-control" id="batchCode" th:field="*{batchCode}">
                        <span th:if="${#fields.hasErrors('batchCode')}" th:errors="*{batchCode}" class="text-danger"></span>
                    </div>
                    
                    <div class="mb-3">
                        <label for="subject" class="form-label">Subject</label>
                        <input type="text" class="form-control" id="subject" th:field="*{subject}">
                        <span th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}" class="text-danger"></span>
                    </div>
                    
                    <div class="mb-3">
                        <label for="teacherId" class="form-label">Teacher</label>
                        <select class="form-select" id="teacherId" th:field="*{teacherId}">
                            <option value="">-- Select Teacher --</option>
                            <option th:each="teacher : ${teachers}" 
                                    th:value="${teacher.id}" 
                                    th:text="${teacher.fullName}"></option>
                        </select>
                        <span th:if="${#fields.hasErrors('teacherId')}" th:errors="*{teacherId}" class="text-danger"></span>
                    </div>
                    
                    <div class="mb-3">
                        <label for="batchDays" class="form-label">Days</label>
                        <input type="text" class="form-control" id="batchDays" th:field="*{batchDays}" placeholder="e.g. MWF">
                        <span th:if="${#fields.hasErrors('batchDays')}" th:errors="*{batchDays}" class="text-danger"></span>
                    </div>
                    
                    <div class="mb-3">
                        <label for="batchTiming" class="form-label">Timing</label>
                        <input type="text" class="form-control" id="batchTiming" th:field="*{batchTiming}" placeholder="e.g. 10:00 AM - 12:00 PM">
                        <span th:if="${#fields.hasErrors('batchTiming')}" th:errors="*{batchTiming}" class="text-danger"></span>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Batch</button>
                        <a th:href="@{/admin/batches}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
