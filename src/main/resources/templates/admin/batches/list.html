<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Batches - AMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>
    
    <div class="container mt-4">
        <!-- Breadcrumb / Navigation -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
                <li class="breadcrumb-item active">Batches</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Manage Batches</h2>
            <a th:href="@{/admin/batches/new}" class="btn btn-primary">➕ Add Batch</a>
        </div>
        
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <table class="table table-bordered table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Batch Code</th>
                    <th>Subject</th>
                    <th>Teacher</th>
                    <th>Days</th>
                    <th>Timing</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="batch : ${batches}">
                    <td th:text="${batch.batchCode}"></td>
                    <td th:text="${batch.subject}"></td>
                    <td th:text="${batch.teacher != null ? batch.teacher.fullName : 'N/A'}"></td>
                    <td th:text="${batch.batchDays}"></td>
                    <td th:text="${batch.batchTiming}"></td>
                    <td>
                        <a th:href="@{/admin/batches/edit/{id}(id=${batch.id})}" class="btn btn-sm btn-warning">Edit</a>
                        <a th:href="@{/admin/batches/delete/{id}(id=${batch.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this batch?')">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(batches)}">
                    <td colspan="6" class="text-center text-muted py-4">No batches found. Click "Add Batch" to create one.</td>
                </tr>
            </tbody>
        </table>

        <!-- Section Navigation -->
        <hr class="mt-4">
        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">← Back to Dashboard</a>
            <a th:href="@{/admin/teachers}" class="btn btn-outline-primary">👨‍🏫 Teachers</a>
            <a th:href="@{/admin/students}" class="btn btn-outline-success">🎓 Students</a>
            <a th:href="@{/admin/reports}" class="btn btn-outline-info">📊 Reports</a>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
