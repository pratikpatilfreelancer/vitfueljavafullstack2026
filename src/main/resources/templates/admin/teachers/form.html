<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${teacherDto.id != null ? 'Edit Teacher' : 'Add Teacher'}">Teacher Form - AMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>
    
    <div class="container mt-4">
        <!-- Breadcrumb / Navigation -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/teachers}">Teachers</a></li>
                <li class="breadcrumb-item active" th:text="${teacherDto.id != null ? 'Edit Teacher' : 'Add Teacher'}">Form</li>
            </ol>
        </nav>

        <h2 th:text="${teacherDto.id != null ? 'Edit Teacher' : 'Add Teacher'}" class="mb-3"></h2>
        
        <div class="card">
            <div class="card-body">
                <form th:action="@{${teacherDto.id != null ? '/admin/teachers/edit/' + teacherDto.id : '/admin/teachers/new'}}" 
                      th:object="${teacherDto}" method="post">
                    
                    <input type="hidden" th:field="*{id}" th:if="${teacherDto.id != null}">
                    
                    <div class="mb-3">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" th:field="*{fullName}">
                        <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-danger"></span>
                    </div>
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" th:field="*{username}">
                        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger"></span>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" th:field="*{password}">
                        <div class="form-text" th:if="${teacherDto.id != null}">Leave blank to keep existing password.</div>
                        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></span>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}">
                        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Teacher</button>
                        <a th:href="@{/admin/teachers}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
