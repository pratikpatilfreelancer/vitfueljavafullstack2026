<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Tourist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 650px;">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill me-2"></i>Add New Tourist</h4>
            </div>
            <div class="card-body p-4">

                <!-- Form binds to the tourist object and posts to /saveTourist -->
                <form th:action="@{/saveTourist}" th:object="${tourist}" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" th:field="*{name}" class="form-control" placeholder="e.g., Jane Doe" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="e.g., jane@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Destination</label>
                        <input type="text" th:field="*{destination}" class="form-control" placeholder="e.g., Paris, France" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Package Price ($)</label>
                            <input type="number" step="0.01" th:field="*{packagePrice}" class="form-control" placeholder="1200.00" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Duration (Days)</label>
                            <input type="number" th:field="*{daysOfStay}" class="form-control" placeholder="7" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="/" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">Save Tourist</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
