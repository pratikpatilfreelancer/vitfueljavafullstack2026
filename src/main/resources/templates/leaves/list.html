<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Leave Requests - Leave Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Leave Requests</h2>
            <a th:href="@{/leaves/apply}" class="btn btn-primary">+ Apply for Leave</a>
        </div>

        <table class="table table-striped table-bordered bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Employee</th>
                    <th>Leave Type</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Days</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!--
                  leave.employee.fullName below is possible because of the
                  @ManyToOne relationship - Hibernate joins leave_requests
                  to employees behind the scenes to fetch this.
                -->
                <tr th:each="leave : ${leaveRequests}">
                    <td th:text="${leave.id}"></td>
                    <td th:text="${leave.employee.fullName}"></td>
                    <td th:text="${leave.leaveType}"></td>
                    <td th:text="${leave.startDate}"></td>
                    <td th:text="${leave.endDate}"></td>
                    <td th:text="${leave.numberOfDays}"></td>
                    <td th:text="${leave.reason}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${leave.status.name() == 'APPROVED'} ? 'bg-success' : (${leave.status.name() == 'REJECTED'} ? 'bg-danger' : 'bg-warning text-dark')"
                              th:text="${leave.status}"></span>
                    </td>
                    <td>
                        <!-- Only show Approve/Reject buttons while status is still PENDING -->
                        <a th:if="${leave.status.name() == 'PENDING'}"
                           th:href="@{/leaves/approve/{id}(id=${leave.id})}"
                           class="btn btn-sm btn-success">Approve</a>
                        <a th:if="${leave.status.name() == 'PENDING'}"
                           th:href="@{/leaves/reject/{id}(id=${leave.id})}"
                           class="btn btn-sm btn-danger">Reject</a>
                        <a th:href="@{/leaves/delete/{id}(id=${leave.id})}"
                           class="btn btn-sm btn-outline-secondary"
                           onclick="return confirm('Delete this leave request?');">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(leaveRequests)}">
                    <td colspan="9" class="text-center text-muted">No leave requests yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
