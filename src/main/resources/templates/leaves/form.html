<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Apply for Leave - Leave Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <h2>Apply for Leave</h2>

        <div class="card shadow-sm p-4 bg-white" style="max-width: 600px;">
            <form th:action="@{/leaves/save}" th:object="${leaveRequest}" method="post">

                <div class="mb-3">
                    <label class="form-label">Employee</label>
                    <!--
                      th:field="*{employee.id}" binds the selected option's
                      value directly to the nested "id" field of
                      LeaveRequest.employee. Spring MVC automatically
                      creates a placeholder Employee object and sets its id
                      from the selected dropdown value (this is called
                      "nested path auto-growing"). The controller then
                      re-loads the FULL Employee from the database using
                      that id before saving - see the comment in
                      LeaveRequestController.applyForLeave() for why that
                      extra step is necessary.
                    -->
                    <select class="form-select" th:field="*{employee.id}">
                        <option value="">-- Select Employee --</option>
                        <option th:each="emp : ${employees}"
                                th:value="${emp.id}"
                                th:text="${emp.fullName} + ' (' + ${emp.department} + ')'"></option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('employee.id')}" th:errors="*{employee.id}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Leave Type</label>
                    <select class="form-select" th:field="*{leaveType}">
                        <option value="">-- Select Leave Type --</option>
                        <option value="Sick Leave">Sick Leave</option>
                        <option value="Casual Leave">Casual Leave</option>
                        <option value="Earned Leave">Earned Leave</option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('leaveType')}" th:errors="*{leaveType}"></div>
                </div>

                <div class="row">
                    <div class="col mb-3">
                        <label class="form-label">Start Date</label>
                        <input type="date" class="form-control" th:field="*{startDate}"/>
                        <div class="text-danger" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
                    </div>
                    <div class="col mb-3">
                        <label class="form-label">End Date</label>
                        <input type="date" class="form-control" th:field="*{endDate}"/>
                        <div class="text-danger" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Reason</label>
                    <textarea class="form-control" th:field="*{reason}" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit Leave Request</button>
                <a th:href="@{/leaves}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>

</body>
</html>
