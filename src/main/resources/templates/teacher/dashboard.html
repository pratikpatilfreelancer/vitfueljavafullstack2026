<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/layout :: header}"></div>
</head>
<body>
    <div class="container mt-4">
        <!-- Account / Role Switch Banner -->
        <div class="d-flex justify-content-between align-items-center bg-white p-3 rounded shadow-sm mb-4">
            <div>
                <h3 class="mb-0">Welcome, <span th:text="${teacher.fullName}">Teacher Name</span> 👋</h3>
                <span class="badge bg-success mt-1">Logged in as Teacher</span>
            </div>
            <div class="d-flex gap-2">
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger">🔄 Switch Account / Log Out</button>
                </form>
            </div>
        </div>
        
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Your Assigned Batches</h4>
            <div>
                <a th:href="@{/teacher/reports}" class="btn btn-outline-info me-2">📊 View Reports</a>
                <a th:href="@{/teacher/settings}" class="btn btn-outline-secondary">⚙️ Account Settings</a>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-4">
            <div class="col" th:each="batch : ${batches}">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" th:text="${batch.batchCode}">Batch Code</h5>
                        <span class="badge bg-light text-dark" th:text="${batch.batchDays}">MWF</span>
                    </div>
                    <div class="card-body">
                        <p class="card-text"><strong>Subject:</strong> <span th:text="${batch.subject}">Subject</span></p>
                        <p class="card-text"><strong>Timing:</strong> <span th:text="${batch.batchTiming}">10:00 AM</span></p>
                    </div>
                    <div class="card-footer bg-white border-top-0 d-flex justify-content-between">
                        <a th:href="@{/teacher/batches/{id}/attendance(id=${batch.id})}" class="btn btn-sm btn-primary">✅ Mark Attendance</a>
                        <a th:href="@{/teacher/batches/{id}/attendance/absentees(id=${batch.id})}" class="btn btn-sm btn-outline-danger">❌ Mark Absentees</a>
                    </div>
                </div>
            </div>
            
            <div class="col-12" th:if="${#lists.isEmpty(batches)}">
                <div class="alert alert-info">
                    You have no assigned batches at this time.
                </div>
            </div>
        </div>

        <hr class="mt-4">
        <div class="d-flex flex-wrap gap-2 mb-4">
            <a th:href="@{/teacher/reports}" class="btn btn-info text-white">📊 Generate Attendance Reports</a>
            <a th:href="@{/teacher/settings}" class="btn btn-secondary">⚙️ Settings</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger">🔑 Log Out / Switch to Admin Login</button>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
