<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:fragment="header">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AMS - Attendance Management System</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            .navbar-brand { font-weight: bold; color: #f8f9fa !important; }
            .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; border: none; }
            .stat-card { text-align: center; padding: 20px; }
            .stat-number { font-size: 2.5rem; font-weight: bold; color: #0d6efd; }
            body { background-color: #f8f9fa; }
        </style>
        
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                    <span>📋</span> AMS
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a class="nav-link" th:href="@{/admin/teachers}">Teachers</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a class="nav-link" th:href="@{/admin/students}">Students</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a class="nav-link" th:href="@{/admin/batches}">Batches</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a class="nav-link" th:href="@{/admin/reports}">Reports</a>
                        </li>
                        
                        <li class="nav-item" sec:authorize="hasRole('TEACHER')">
                            <a class="nav-link" th:href="@{/teacher/dashboard}">Dashboard</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('TEACHER')">
                            <a class="nav-link" th:href="@{/teacher/reports}">Reports</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('TEACHER')">
                            <a class="nav-link" th:href="@{/teacher/settings}">Settings</a>
                        </li>
                    </ul>
                    
                    <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                        <span class="badge bg-primary px-2 py-1" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                        <span class="badge bg-success px-2 py-1" sec:authorize="hasRole('TEACHER')">TEACHER</span>
                        
                        <span class="text-light small">
                            User: <strong sec:authentication="name">User</strong>
                        </span>
                        
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-light btn-sm" title="Log out and switch account">
                                🔑 Switch Account / Logout
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </nav>
    </th:block>
</head>
<body>

    <th:block th:fragment="footer">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>
</body>
</html>
