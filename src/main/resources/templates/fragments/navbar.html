<!--
  Reusable navbar fragment.
  Other templates pull this in with:
    <div th:replace="~{fragments/navbar :: navbar}"></div>
  This avoids copy-pasting the same <nav> HTML into every page.
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/dashboard}">Leave Management System</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/employees}">Employees</a>
                <a class="nav-link" th:href="@{/leaves}">Leave Requests</a>
                <a class="nav-link" th:href="@{/leaves/apply}">Apply Leave</a>
            </div>
        </div>
    </nav>
</body>
</html>
