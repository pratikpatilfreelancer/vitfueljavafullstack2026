<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/layout :: header}"></div>
</head>
<body>
    <div class="container mt-5">
        <div class="alert alert-danger shadow-sm">
            <h4 class="alert-heading" th:text="${errorTitle ?: 'Error'}">Error Occurred</h4>
            <p th:text="${errorMessage ?: 'An unexpected error occurred.'}">Something went wrong.</p>
            <hr>
            <p class="mb-0">
                <a th:href="@{/}" class="btn btn-danger">Go Back to Dashboard</a>
            </p>
        </div>
    </div>
    
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
