# Server port
server.port=8081

# Database Connection URL (connecting to tourist_db created in Step 1)
spring.datasource.url=jdbc:mysql://localhost:3306/tourist_db?useSSL=false&serverTimezone=UTC

# MySQL Credentials (change these to match your local setup)
spring.datasource.username=root
spring.datasource.password=4pp13p13s

# MySQL Driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings
# "update" automatically creates or modifies DB tables based on Java entity classes without deleting existing data
spring.jpa.hibernate.ddl-auto=update

# Shows executed SQL queries in the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect