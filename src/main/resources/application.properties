# ============================================================
# Application settings
# ============================================================
spring.application.name=leave-management-system
server.port=8080

# ============================================================
# MySQL Database connection
# ------------------------------------------------------------
# CHANGE spring.datasource.username / password below to match
# your own local MySQL setup before running the project.
#
# createDatabaseIfNotExist=true will automatically create the
# "leave_management_db" database the first time you run the app,
# so you only need to have MySQL Server itself installed and running.
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/leave_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=xxxxxxxx
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate settings
# ------------------------------------------------------------
# ddl-auto=update: Hibernate automatically creates/updates tables
# to match the @Entity classes. Great for learning/development -
# you never have to hand-write CREATE TABLE statements.
# show-sql=true: prints every SQL query Hibernate runs to the
# console, which is very useful for understanding what's happening
# and for explaining the project in a viva.
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================================
# Sample data loading (data.sql)
# ------------------------------------------------------------
# By default, Spring Boot runs data.sql BEFORE Hibernate creates
# the tables, which would fail. This setting defers data.sql until
# AFTER Hibernate has created the schema via ddl-auto above.
# ============================================================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ============================================================
# Thymeleaf settings
# ------------------------------------------------------------
# cache=false: templates reload automatically on change without
# restarting the app - convenient while developing in VS Code.
# ============================================================
spring.thymeleaf.cache=false
