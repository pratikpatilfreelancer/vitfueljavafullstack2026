<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartHire — Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="shr-app">
  <div id="shrSidebarMount"></div>
  <main class="shr-main">
    <div class="shr-topbar">
      <div>
        <h1 class="display-font">Recruitment reports</h1>
        <p>How your pipeline is performing across every open role.</p>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div class="stat-card__icon" style="background:var(--shr-violet-soft); color:var(--shr-violet);"><i class="bi bi-briefcase"></i></div>
          <div><div class="stat-card__value" id="rTotalJobs">0</div><div class="stat-card__label">Total jobs posted</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div class="stat-card__icon" style="background:var(--shr-teal-soft); color:var(--shr-teal);"><i class="bi bi-toggle-on"></i></div>
          <div><div class="stat-card__value" id="rOpenJobs">0</div><div class="stat-card__label">Currently open</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div class="stat-card__icon" style="background:var(--shr-amber-soft); color:#a5731c;"><i class="bi bi-people"></i></div>
          <div><div class="stat-card__value" id="rTotalApps">0</div><div class="stat-card__label">Applications received</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div class="stat-card__icon" style="background:#DFF3E3; color:#1E8A4C;"><i class="bi bi-percent"></i></div>
          <div><div class="stat-card__value" id="rHireRate">0%</div><div class="stat-card__label">Hire rate</div></div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-6">
        <div class="shr-card shr-card-pad">
          <h5 class="display-font mb-3">Applications by status</h5>
          <div id="statusBreakdown"></div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="shr-card shr-card-pad">
          <h5 class="display-font mb-3">Average match score per job</h5>
          <div id="avgByJob"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const user = mountShell("reports", "RECRUITER");
  if (user) {
    const recruiter = Repo.recruiterByUserId(user.userId);
    const report = Repo.reportsForRecruiter(recruiter.recruiterId);

    document.getElementById("rTotalJobs").textContent = report.totalJobs;
    document.getElementById("rOpenJobs").textContent = report.openJobs;
    document.getElementById("rTotalApps").textContent = report.totalApplications;
    const hired = report.byStatus.HIRED || 0;
    document.getElementById("rHireRate").textContent = report.totalApplications ? Math.round((hired / report.totalApplications) * 100) + "%" : "0%";

    const statusOrder = ["APPLIED", "SHORTLISTED", "INTERVIEW_SCHEDULED", "HIRED", "REJECTED"];
    const statusColors = { APPLIED: "var(--shr-violet)", SHORTLISTED: "var(--shr-teal)", INTERVIEW_SCHEDULED: "var(--shr-amber)", HIRED: "#1E8A4C", REJECTED: "var(--shr-coral)" };
    const max = Math.max(1, ...statusOrder.map(s => report.byStatus[s] || 0));

    document.getElementById("statusBreakdown").innerHTML = report.totalApplications ? statusOrder.map(s => {
      const count = report.byStatus[s] || 0;
      const pct = Math.round((count / max) * 100);
      return `
      <div class="mb-3">
        <div class="d-flex justify-content-between small mb-1">
          <span>${STATUS_META[s].label}</span><span class="fw-bold mono">${count}</span>
        </div>
        <div class="progress" style="height:10px; border-radius:6px;">
          <div class="progress-bar" style="width:${pct}%; background:${statusColors[s]};"></div>
        </div>
      </div>`;
    }).join("") : `<div class="empty-state py-4"><i class="bi bi-bar-chart d-block mb-2"></i>No application data yet.</div>`;

    document.getElementById("avgByJob").innerHTML = report.avgByJob.length ? report.avgByJob
      .sort((a, b) => b.avgScore - a.avgScore)
      .map(r => `
      <div class="d-flex align-items-center justify-content-between py-2 border-bottom">
        <div>
          <div class="fw-semibold small">${escapeHtml(r.job.title)}</div>
          <div class="text-muted" style="font-size:.74rem;">${r.count} applicant${r.count === 1 ? "" : "s"}</div>
        </div>
        ${scoreRing(r.avgScore, 46)}
      </div>`).join("") : `<div class="empty-state py-4"><i class="bi bi-graph-up d-block mb-2"></i>No jobs yet.</div>`;
  }
</script>
</body>
</html>
