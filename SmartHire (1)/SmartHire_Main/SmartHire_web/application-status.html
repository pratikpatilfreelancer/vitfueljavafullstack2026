<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartHire — My Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="shr-app">
  <div id="shrSidebarMount"></div>
  <main class="shr-main">
    <div class="shr-topbar">
      <div>
        <h1 class="display-font">My applications</h1>
        <p>Track every application from applied to hired.</p>
      </div>
    </div>

    <div id="appsList" class="d-flex flex-column gap-3"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const user = mountShell("applications", "CANDIDATE");
  if (user) {
    const candidate = Repo.candidateByUserId(user.userId);
    const apps = Repo.applicationsByCandidate(candidate.candidateId);
    const interviews = Repo.interviewsByCandidate(candidate.candidateId);
    const host = document.getElementById("appsList");

    if (!apps.length) {
      host.innerHTML = `<div class="shr-card"><div class="empty-state"><i class="bi bi-clipboard-data d-block mb-2"></i>No applications yet. <a href="job-search.html">Find a job to apply to</a>.</div></div>`;
    } else {
      host.innerHTML = apps.slice().reverse().map(a => {
        const steps = ["APPLIED", "SHORTLISTED", "INTERVIEW_SCHEDULED", "HIRED"];
        const isRejected = a.status === "REJECTED";
        const currentIdx = isRejected ? 0 : steps.indexOf(a.status);
        const interview = interviews.find(i => i.applicationId === a.applicationId);

        return `
        <div class="shr-card shr-card-pad">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3">
            <div class="d-flex align-items-center gap-3">
              ${scoreRing(a.matchScore, 56)}
              <div>
                <div class="fw-bold fs-5">${escapeHtml(a.job.title)}</div>
                <div class="text-muted small"><i class="bi bi-geo-alt me-1"></i>${escapeHtml(a.job.location)} · Applied ${formatDate(a.appliedDate)}</div>
              </div>
            </div>
            ${statusBadge(a.status)}
          </div>

          ${isRejected ? `
            <div class="alert alert-light border small mb-0" style="background:var(--shr-coral-soft); color:var(--shr-coral); border:none !important;">
              <i class="bi bi-x-circle me-1"></i> This application was not moved forward.
            </div>` : `
            <div class="status-timeline">
              ${steps.map((s, i) => `
                <div class="step ${i < currentIdx ? "done" : i === currentIdx ? "current" : ""}">
                  <div class="line"></div>
                  <div class="dot"><i class="bi ${i <= currentIdx ? "bi-check-lg" : "bi-circle"}"></i></div>
                  <div class="step-label">${STATUS_META[s].label}</div>
                </div>`).join("")}
            </div>`}

          ${interview ? `
            <div class="d-flex align-items-center gap-2 mt-3 pt-3 border-top small">
              <i class="bi bi-camera-video" style="color:var(--shr-amber);"></i>
              <span>Interview on <strong>${formatDate(interview.interviewDate)}</strong> at ${interview.interviewTime} · ${interview.mode.replace("_", " ")}</span>
              ${statusBadge(interview.status)}
            </div>
            ${interview.feedback ? `<div class="small text-muted mt-1">Feedback: "${escapeHtml(interview.feedback)}"${interview.rating ? " · Rating: " + "★".repeat(interview.rating) : ""}</div>` : ""}
          ` : ""}
        </div>`;
      }).join("");
    }
  }
</script>
</body>
</html>
