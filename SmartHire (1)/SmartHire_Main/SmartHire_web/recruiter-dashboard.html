<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartHire — Recruiter Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="shr-app">
  <div id="shrSidebarMount"></div>
  <main class="shr-main">
    <div class="shr-topbar">
      <div>
        <h1 id="greeting" class="display-font"></h1>
        <p>Your hiring pipeline at a glance.</p>
      </div>
      <a href="job-management.html" class="btn btn-shr-teal"><i class="bi bi-plus-lg me-1"></i> Post a job</a>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div class="stat-card__icon" style="background:var(--shr-violet-soft); color:var(--shr-violet);"><i class="bi bi-briefcase"></i></div>
          <div><div class="stat-card__value" id="statOpenJobs">0</div><div class="stat-card__label">Open jobs</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div class="stat-card__icon" style="background:var(--shr-teal-soft); color:var(--shr-teal);"><i class="bi bi-people"></i></div>
          <div><div class="stat-card__value" id="statApplicants">0</div><div class="stat-card__label">Total applicants</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div class="stat-card__icon" style="background:var(--shr-amber-soft); color:#a5731c;"><i class="bi bi-calendar-check"></i></div>
          <div><div class="stat-card__value" id="statInterviews">0</div><div class="stat-card__label">Interviews scheduled</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div class="stat-card__icon" style="background:#DFF3E3; color:#1E8A4C;"><i class="bi bi-trophy"></i></div>
          <div><div class="stat-card__value" id="statHired">0</div><div class="stat-card__label">Hired</div></div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="shr-card shr-card-pad">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="display-font mb-0">Your open jobs</h5>
            <a href="job-management.html" class="small fw-semibold" style="color:var(--shr-teal);">Manage →</a>
          </div>
          <div id="jobsList"></div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="shr-card shr-card-pad">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="display-font mb-0">Top matches</h5>
            <a href="applicant-management.html" class="small fw-semibold" style="color:var(--shr-teal);">Screen →</a>
          </div>
          <div id="topMatches"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const user = mountShell("dashboard", "RECRUITER");
  if (user) {
    const recruiter = Repo.recruiterByUserId(user.userId);
    document.getElementById("greeting").textContent = `Welcome back, ${user.fullName.split(" ")[0]}`;

    const jobs = Repo.jobsByRecruiter(recruiter.recruiterId);
    const apps = Repo.applicationsByRecruiter(recruiter.recruiterId);
    const interviews = Repo.interviewsByRecruiter(recruiter.recruiterId);

    document.getElementById("statOpenJobs").textContent = jobs.filter(j => j.status === "OPEN").length;
    document.getElementById("statApplicants").textContent = apps.length;
    document.getElementById("statInterviews").textContent = interviews.filter(i => i.status === "SCHEDULED").length;
    document.getElementById("statHired").textContent = apps.filter(a => a.status === "HIRED").length;

    const jobsHost = document.getElementById("jobsList");
    const openJobs = jobs.filter(j => j.status === "OPEN");
    jobsHost.innerHTML = openJobs.length ? openJobs.map(j => {
      const count = apps.filter(a => a.jobId === j.jobId).length;
      return `
      <div class="d-flex align-items-center justify-content-between py-2 border-bottom">
        <div>
          <div class="fw-semibold">${escapeHtml(j.title)}</div>
          <div class="text-muted small"><i class="bi bi-geo-alt me-1"></i>${escapeHtml(j.location)} · Posted ${formatDate(j.postedDate)}</div>
        </div>
        <div class="text-end">
          <div class="fw-bold mono">${count}</div>
          <div class="text-muted" style="font-size:.72rem;">applicant${count === 1 ? "" : "s"}</div>
        </div>
      </div>`;
    }).join("") : `<div class="empty-state py-4"><i class="bi bi-briefcase d-block mb-2"></i>No open jobs yet. <a href="job-management.html">Post your first one</a>.</div>`;

    const topHost = document.getElementById("topMatches");
    const ranked = apps.slice().sort((a, b) => b.matchScore - a.matchScore).slice(0, 5);
    topHost.innerHTML = ranked.length ? ranked.map(a => `
      <div class="d-flex align-items-center justify-content-between py-2 border-bottom">
        <div class="d-flex align-items-center gap-2">
          <div class="shr-user__avatar" style="background:var(--shr-bg); color:var(--shr-navy);">${initials(a.candidateName)}</div>
          <div>
            <div class="fw-semibold small">${escapeHtml(a.candidateName)}</div>
            <div class="text-muted" style="font-size:.75rem;">${escapeHtml(a.job.title)}</div>
          </div>
        </div>
        ${scoreRing(a.matchScore, 42)}
      </div>`).join("") : `<div class="empty-state py-4"><i class="bi bi-people d-block mb-2"></i>No applicants yet.</div>`;
  }
</script>
</body>
</html>
