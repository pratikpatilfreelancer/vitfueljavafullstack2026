<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartHire — Find Jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="shr-app">
  <div id="shrSidebarMount"></div>
  <main class="shr-main">
    <div class="shr-topbar">
      <div>
        <h1 class="display-font">Find jobs</h1>
        <p>Match scores below are computed live from your profile.</p>
      </div>
    </div>

    <div class="shr-card shr-card-pad mb-4">
      <div class="row g-2">
        <div class="col-md-6">
          <input type="text" id="qSearch" class="form-control" placeholder="Search by title or skill…">
        </div>
        <div class="col-md-3">
          <input type="text" id="qLocation" class="form-control" placeholder="Location…">
        </div>
        <div class="col-md-3">
          <select id="qSort" class="form-select">
            <option value="score">Sort: best match</option>
            <option value="recent">Sort: most recent</option>
          </select>
        </div>
      </div>
    </div>

    <div class="row g-3" id="jobGrid"></div>
  </main>
</div>

<!-- Apply modal -->
<div class="modal fade" id="applyModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:16px; border:none;">
      <div class="modal-body p-4" id="applyModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const user = mountShell("jobs", "CANDIDATE");
  let candidate, applyModal;

  if (user) {
    candidate = Repo.candidateByUserId(user.userId);
    applyModal = new bootstrap.Modal(document.getElementById("applyModal"));
    renderJobs();
    document.getElementById("qSearch").addEventListener("input", renderJobs);
    document.getElementById("qLocation").addEventListener("input", renderJobs);
    document.getElementById("qSort").addEventListener("change", renderJobs);
  }

  function renderJobs() {
    const q = document.getElementById("qSearch").value.trim().toLowerCase();
    const loc = document.getElementById("qLocation").value.trim().toLowerCase();
    const sort = document.getElementById("qSort").value;

    let jobs = Repo.openJobs().map(j => ({
      job: j,
      score: ScreeningService.calculateMatchScore(candidate, j),
      applied: Repo.hasApplied(candidate.candidateId, j.jobId)
    }));

    jobs = jobs.filter(({ job }) =>
      (!q || job.title.toLowerCase().includes(q) || job.requiredSkills.toLowerCase().includes(q)) &&
      (!loc || job.location.toLowerCase().includes(loc))
    );

    jobs.sort((a, b) => sort === "score" ? b.score - a.score : b.job.jobId - a.job.jobId);

    const grid = document.getElementById("jobGrid");
    if (!jobs.length) {
      grid.innerHTML = `<div class="col-12"><div class="empty-state"><i class="bi bi-search d-block mb-2"></i>No jobs match your search.</div></div>`;
      return;
    }

    grid.innerHTML = jobs.map(({ job, score, applied }) => `
      <div class="col-md-6 col-xl-4">
        <div class="job-card d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <div class="job-card__title">${escapeHtml(job.title)}</div>
              <div class="job-card__meta"><i class="bi bi-geo-alt me-1"></i>${escapeHtml(job.location)} · ${job.minExperience}+ yrs exp</div>
            </div>
            ${scoreRing(score, 52)}
          </div>
          <p class="small text-muted flex-grow-1" style="min-height:44px;">${escapeHtml(job.description).slice(0, 100)}${job.description.length > 100 ? "…" : ""}</p>
          <div class="mb-3">
            ${ScreeningService.tokenizeSkills(job.requiredSkills).slice(0, 4).map(s => `<span class="skill-pill">${escapeHtml(s)}</span>`).join("")}
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-shr btn-sm flex-grow-1" onclick="showJobDetail(${job.jobId})"><i class="bi bi-eye me-1"></i>Details</button>
            ${applied
              ? `<button class="btn btn-sm flex-grow-1" style="background:var(--shr-teal-soft); color:var(--shr-teal); border:none;" disabled><i class="bi bi-check2 me-1"></i>Applied</button>`
              : `<button class="btn btn-shr-teal btn-sm flex-grow-1" onclick="showJobDetail(${job.jobId})"><i class="bi bi-send me-1"></i>Apply</button>`}
          </div>
        </div>
      </div>`).join("");
  }

  function showJobDetail(jobId) {
    const job = Repo.jobById(jobId);
    const score = ScreeningService.calculateMatchScore(candidate, job);
    const label = ScreeningService.scoreLabel(score);
    const applied = Repo.hasApplied(candidate.candidateId, jobId);
    const skillMatch = Math.round(ScreeningService.calculateSkillMatch(candidate, job));
    const expMatch = Math.round(ScreeningService.calculateExperienceMatch(candidate, job));

    document.getElementById("applyModalBody").innerHTML = `
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
          <div class="section-eyebrow">${escapeHtml(job.location)}</div>
          <h4 class="display-font fw-bold mb-0">${escapeHtml(job.title)}</h4>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <p class="text-muted">${escapeHtml(job.description)}</p>
      <div class="mb-3">${ScreeningService.tokenizeSkills(job.requiredSkills).map(s => `<span class="skill-pill">${escapeHtml(s)}</span>`).join("")}</div>

      <div class="shr-card shr-card-pad d-flex align-items-center gap-3 mb-3" style="background:var(--shr-bg); border:none;">
        ${scoreRing(score, 64)}
        <div>
          <div class="fw-bold">${label}</div>
          <div class="small text-muted">Skill overlap ${skillMatch}% · Experience fit ${expMatch}%</div>
        </div>
      </div>

      ${applied
        ? `<div class="alert alert-secondary small mb-0"><i class="bi bi-check-circle me-1"></i>You've already applied to this job.</div>`
        : `<button class="btn btn-shr-teal w-100 py-2" onclick="applyNow(${job.jobId})"><i class="bi bi-send me-1"></i>Apply with my profile</button>`}
    `;
    applyModal.show();
  }

  function applyNow(jobId) {
    try {
      const score = Repo.applyToJob(candidate.candidateId, jobId);
      applyModal.hide();
      toast(`Applied! Your match score: ${Math.round(score)}/100`, "success");
      renderJobs();
    } catch (err) {
      toast(err.message, "danger");
    }
  }
</script>
</body>
</html>
