spring.application.name=apartment-maintenance
spring.datasource.url=jdbc:mysql://localhost:3306/apartment_maintenance_db
spring.datasource.username=root
spring.datasource.password=Brindha1234
server.port=8080

# 1. Changed from 'validate' to 'update' so Hibernate dynamically fixes small mapping mismatches safely
