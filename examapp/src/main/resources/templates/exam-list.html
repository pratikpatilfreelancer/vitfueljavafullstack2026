<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Exams</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
    <h1>All Exams</h1>
    <a th:href="@{/}" class="back-link">&larr; Home</a>

    <table>
        <tr>
            <th>Title</th>
            <th>Total Marks</th>
            <th>Actions</th>
        </tr>
        <tr th:each="exam : ${exams}">
            <td th:text="${exam.title}"></td>
            <td th:text="${exam.totalMarks}"></td>
            <td>
                <a th:href="@{/exams/{id}/edit(id=${exam.id})}" class="btn-small">Edit</a>
                <a th:href="@{/exams/{id}/questions(id=${exam.id})}" class="btn-small">Add Questions</a>
                <a th:href="@{/exams/{id}/attempt(id=${exam.id})}" class="btn-small">Attempt</a>
                <form th:action="@{/exams/{id}/delete(id=${exam.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn-small btn-danger" onclick="return confirm('Delete this exam?')">Delete</button>
                </form>
            </td>
        </tr>
    </table>
    <br/>
    <a th:href="@{/exams/create}" class="btn">+ Create New Exam</a>
</body>
</html>
