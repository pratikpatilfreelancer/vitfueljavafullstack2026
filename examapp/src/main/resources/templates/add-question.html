<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Question</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
    <h1>Add Question to Exam <span th:text="${examId}"></span></h1>

    <h3>Add MCQ Question</h3>
    <form th:action="@{/exams/{id}/questions/mcq(id=${examId})}" method="post">
        <label>Question Text:</label>
        <input type="text" name="questionText" required /><br/>
        <label>Option 1:</label>
        <input type="text" name="option1" required /><br/>
        <label>Option 2:</label>
        <input type="text" name="option2" required /><br/>
        <label>Option 3:</label>
        <input type="text" name="option3" required /><br/>
        <label>Correct Option (0, 1, or 2):</label>
        <input type="number" name="correctIndex" min="0" max="2" required /><br/>
        <button type="submit">Add MCQ Question</button>
    </form>

    <h3>Add True/False Question</h3>
    <form th:action="@{/exams/{id}/questions/truefalse(id=${examId})}" method="post">
        <label>Question Text:</label>
        <input type="text" name="questionText" required /><br/>
        <label>Correct Answer:</label>
        <select name="correctBoolean">
            <option value="true">True</option>
            <option value="false">False</option>
        </select><br/>
        <button type="submit">Add True/False Question</button>
    </form>

    <h3>Existing Questions</h3>
    <table>
        <tr>
            <th>Question</th>
            <th>Type</th>
            <th>Actions</th>
        </tr>
        <tr th:each="question : ${questions}">
            <td th:text="${question.questionText}"></td>
            <td th:text="${question.getClass().getSimpleName()}"></td>
            <td>
                <a th:href="@{/questions/{id}/edit(id=${question.id})}" class="btn-small">Edit</a>
                <form th:action="@{/questions/{id}/delete(id=${question.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn-small btn-danger" onclick="return confirm('Delete this question?')">Delete</button>
                </form>
            </td>
        </tr>
    </table>

    <br/>
    <a th:href="@{/exams}" class="btn">Done — Back to All Exams</a>
</body>
</html>
