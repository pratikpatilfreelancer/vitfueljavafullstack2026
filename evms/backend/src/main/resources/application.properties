# ===========================================================================
# EVMS — Spring Boot Application Properties
# ===========================================================================

# ---- Server ----
server.port=4000

# ---- MySQL Datasource ----
spring.datasource.url=jdbc:mysql://localhost:3306/evms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- SQL Initialisation (seed data) ----
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---- JWT ----
jwt.secret=replace-with-a-long-random-secret
jwt.expiration-ms=28800000

# ---- File Uploads ----
file.upload-dir=./uploads/signatures
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ---- Jackson (JSON) ----
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
