<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PocketTrack - Savings</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/transactions/add}">Add Transaction</a>
    <a th:href="@{/savings}">Savings</a>
</div>

<div class="container">
    <h1>Savings</h1>

    <div class="card">
        <h3>Current Savings Balance</h3>
        <div class="amount" th:text="'₹ ' + ${savings.balance}">₹ 0.00</div>
    </div>

    <h2>Deposit Money</h2>

    <form th:action="@{/savings/deposit}" method="post">
        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount"
                   min="0.01" step="0.01" required>
        </div>

        <div class="form-group">
            <label for="note">Note</label>
            <input type="text" id="note" name="note"
                   placeholder="Optional note">
        </div>

        <button type="submit">Add to Savings</button>
    </form>

    <h2>Savings History</h2>

    <table>
        <thead>
        <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Note</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="log : ${history}">
            <td th:text="${log.logDate}"></td>
            <td th:text="${log.logType}"></td>
            <td th:text="'₹ ' + ${log.amount}"></td>
            <td th:text="${log.note}"></td>
        </tr>

        <tr th:if="${#lists.isEmpty(history)}">
            <td colspan="4">No savings history found.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
