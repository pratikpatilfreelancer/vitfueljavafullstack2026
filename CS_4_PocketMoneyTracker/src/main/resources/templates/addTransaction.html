<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PocketTrack - Add Transaction</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/transactions/add}">Add Transaction</a>
    <a th:href="@{/savings}">Savings</a>
</div>

<div class="container">

    <h1>Add Transaction</h1>

    <form th:action="@{/transactions/add}"
          th:object="${transaction}"
          method="post"
          enctype="multipart/form-data">

        <input type="hidden" id="billImagePath" th:field="*{billImagePath}">

        <div class="form-group">
            <label for="type">Transaction Type</label>
            <select id="type" th:field="*{type}" required>
                <option value="">Select Type</option>
                <option value="EXPENSE">Expense</option>
                <option value="INCOME">Income</option>
            </select>
        </div>

        <div class="form-group">
            <label for="categoryId">Category</label>
            <select id="categoryId" th:field="*{categoryId}" required>
                <option value="">Select Category</option>
                <option th:each="category : ${categories}"
                        th:value="${category.categoryId}"
                        th:text="${category.name + ' (' + category.type + ')'}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" th:field="*{amount}"
                   min="0.01" step="0.01" required>
        </div>

        <div class="form-group">
            <label for="transactionDate">Date</label>
            <input type="date" id="transactionDate"
                   th:field="*{transactionDate}" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}"
                      placeholder="Enter transaction description"></textarea>
        </div>

        <div class="form-group">
            <label for="billImage">Attach Bill Photo</label>
            <input type="file" id="billImage" name="billImage" accept="image/*">
        </div>

        <div class="form-group">
            <button type="button" id="scanButton">Scan Bill</button>
        </div>

        <p id="scanStatus"></p>

        <button type="submit">Save Transaction</button>
    </form>

</div>

<script>
    document.getElementById("scanButton").addEventListener("click", async function () {
        const fileInput = document.getElementById("billImage");
        const status = document.getElementById("scanStatus");

        if (!fileInput.files.length) {
            status.textContent = "Please select a bill image first.";
            return;
        }

        const formData = new FormData();
        formData.append("image", fileInput.files[0]);
        status.textContent = "Scanning bill...";

        try {
            const response = await fetch("/transactions/scan-bill", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Bill scanning failed.");
            }

            document.getElementById("amount").value = data.amount;
            document.getElementById("billImagePath").value = data.billImagePath;
            status.textContent = "Bill scanned successfully. Amount filled automatically.";
        } catch (error) {
            status.textContent = error.message;
        }
    });
</script>

</body>
</html>
